services:
  - type: web
    name: joetech
    env: node
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    # Verify the database is reachable before switching traffic to the new
    # instance. If this exits non-zero the deploy is aborted and the old
    # instance keeps serving — zero mid-deploy 502s guaranteed.
    preDeployCommand: >
      node -e "
        const { Pool } = require('pg');
        const p = new Pool({ connectionString: process.env.DATABASE_URL });
        p.query('SELECT 1')
          .then(() => { console.log('[predeploy] DB ready'); return p.end(); })
          .then(() => process.exit(0))
          .catch(e => { console.error('[predeploy] DB check failed:', e.message); process.exit(1); });
      "
    startCommand: node ./dist/index.cjs
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: joetech-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true

databases:
  - name: joetech-db
    databaseName: joe_technologies
    user: joe_tech
    plan: free
    ipAllowList: []
