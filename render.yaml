services:
  - type: web
    name: joetech
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node ./dist/index.cjs
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: joetech-db
          property: connectionString
      - key: ADMIN_SECRET
        sync: false

databases:
  - name: joetech-db
    databaseName: joe_technologies
    user: joe_tech
    plan: free
