services:
  - type: web
    name: joetech
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node ./dist/index.cjs
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: joetech-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true

databases:
  - name: joetech-db
    databaseName: joe_technologies
    user: joe_tech
    plan: free
    ipAllowList: []
