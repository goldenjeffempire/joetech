# Render represents Static Sites as type: web with runtime: static.
# This creates a new static site; the existing service/database are not deleted.
services:
  - type: web
    name: joetech-static
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:static
    staticPublishPath: ./dist/public
    autoDeploy: true
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: redirect
        source: /qualify
        destination: /contact
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /services
        destination: /services/index.html
      - type: rewrite
        source: /services/app-development
        destination: /services/app-development/index.html
      - type: rewrite
        source: /services/website-design
        destination: /services/website-design/index.html
      - type: rewrite
        source: /services/uiux-design
        destination: /services/uiux-design/index.html
      - type: rewrite
        source: /services/automation
        destination: /services/automation/index.html
      - type: rewrite
        source: /services/ai-strategy
        destination: /services/ai-strategy/index.html
      - type: rewrite
        source: /services/custom-ai
        destination: /services/custom-ai/index.html
      - type: rewrite
        source: /services/mlops
        destination: /services/mlops/index.html
      - type: rewrite
        source: /services/ai-integration
        destination: /services/ai-integration/index.html
      - type: rewrite
        source: /services/full-stack
        destination: /services/full-stack/index.html
      - type: rewrite
        source: /services/advisory
        destination: /services/advisory/index.html
      - type: rewrite
        source: /portfolio
        destination: /portfolio/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /faq
        destination: /faq/index.html
      - type: rewrite
        source: /why-us
        destination: /why-us/index.html
      - type: rewrite
        source: /process
        destination: /process/index.html
      - type: rewrite
        source: /tech-stack
        destination: /tech-stack/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /cookies
        destination: /cookies/index.html
      - type: rewrite
        source: /*
        destination: /index.html
