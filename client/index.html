<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#00c8ff" />
    <meta name="color-scheme" content="dark light" />
    <meta name="msapplication-TileColor" content="#0f172a" />

    <!-- Primary SEO Meta -->
    <title>JOE Technologies — Apps, Websites, Automation, UI/UX & AI Solutions</title>
    <meta name="description" content="JOE Technologies builds high-performance apps, websites, automation systems, UI/UX experiences, and AI-powered solutions for businesses and organisations. We design, engineer, and deploy premium digital platforms that convert, automate, scale, and perform." />
    <meta name="keywords" content="app development, website development, automation systems, UI/UX design, AI solutions, machine learning, software engineering, full-stack development, MLOps, AI integration, digital systems, JOE Technologies" />
    <meta name="author" content="Jeffery Onome Emuodafevware" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Geographic & Language -->
    <meta name="language" content="English" />
    <meta property="og:locale" content="en_US" />
    <meta name="geo.region" content="NG" />
    <meta name="geo.country" content="Nigeria" />
    <meta name="rating" content="general" />
    <meta name="revisit-after" content="7 days" />

    <!-- Canonical -->
    <link rel="canonical" href="https://joetech.com.ng/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JOE Technologies" />
    <meta property="og:url" content="https://joetech.com.ng/" />
    <meta property="og:title" content="JOE Technologies — Apps, Websites, Automation, UI/UX & AI Solutions" />
    <meta property="og:description" content="JOE Technologies builds high-performance apps, websites, automation systems, UI/UX experiences, and AI-powered solutions for businesses and organisations." />
    <meta property="og:image" content="https://joetech.com.ng/og-image.png" />
    <meta property="og:image:secure_url" content="https://joetech.com.ng/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JOE Technologies — Enterprise Digital Solutions" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@joetechnologies" />
    <meta name="twitter:creator" content="@joetechnologies" />
    <meta name="twitter:title" content="JOE Technologies — Apps, Websites, Automation, UI/UX & AI Solutions" />
    <meta name="twitter:description" content="JOE Technologies builds high-performance apps, websites, automation systems, UI/UX experiences, and AI-powered solutions for businesses and organisations." />
    <meta name="twitter:image" content="https://joetech.com.ng/og-image.png" />
    <meta name="twitter:image:alt" content="JOE Technologies — Enterprise Digital Solutions" />

    <!-- Performance: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Note: og-image.png is intentionally NOT preloaded — it is a social
         sharing asset, never rendered as a visible DOM element, so preloading
         it wastes bandwidth and triggers a browser warning. -->

    <!-- Fonts: truly non-render-blocking load via media=print swap trick.
         Oxanium = headings (font-heading), Inter = body text, JetBrains Mono = code.
         media="print" is parsed immediately but doesn't block rendering; onload
         switches it to "all" so fonts apply once the stylesheet is ready. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    </noscript>

    <style>
      :root {
        --font-sans: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      html { background: #0f172a; }
      html:not(.dark) { background: #f8faff; }
    </style>

    <!-- JSON-LD Structured Data: Site-level -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://joetech.com.ng/#organization",
          "name": "JOE Technologies",
          "url": "https://joetech.com.ng",
          "logo": {
            "@type": "ImageObject",
            "url": "https://joetech.com.ng/favicon.png",
            "width": 32,
            "height": 32
          },
          "image": "https://joetech.com.ng/og-image.png",
          "description": "Enterprise technology company specialising in app development, website development, digital systems engineering, business automation, UI/UX design, and AI-powered solutions.",
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "contactType": "Customer Service",
              "availableLanguage": "English"
            }
          ],
          "sameAs": [
            "https://onome-portfolio-ten.vercel.app/?/projects",
            "https://linkedin.com/company/joe-technologies",
            "https://github.com/joe-technologies",
            "https://instagram.com/joetech.ai",
            "https://facebook.com/search/top?q=JOE%20Technologies"
          ],
          "areaServed": "Worldwide",
          "knowsAbout": [
            "App Development",
            "Website Design & Development",
            "Business Process Automation",
            "UI/UX Design",
            "Artificial Intelligence",
            "Machine Learning",
            "MLOps",
            "Full-Stack Development",
            "AI Strategy",
            "Technology Advisory"
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Digital & AI Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "App Development" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design & Development" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "UI/UX Design" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Process Automation" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom AI & Machine Learning" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Strategy & Architecture" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "MLOps & AI Infrastructure" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Integration & APIs" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Full-Stack Development" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Technology Advisory" } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://joetech.com.ng/#website",
          "url": "https://joetech.com.ng",
          "name": "JOE Technologies",
          "description": "Enterprise digital product and AI solutions company",
          "publisher": { "@id": "https://joetech.com.ng/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://joetech.com.ng/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
